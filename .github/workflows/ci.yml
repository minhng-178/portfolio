# Checks every push/PR; deploys ui/ to GitHub Pages from main once checks pass.
name: CI & Deploy

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: cv_data.json is in sync with content/
        run: npm run check
      - name: UI scripts parse
        run: for f in ui/js/*.js; do node --check "$f"; done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r server/requirements-dev.txt
      - name: API tests
        working-directory: server
        run: python -m pytest -q

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; never cancel one that is in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replace the dev symlink with the real cv_data.json
        run: rm ui/cv_data.json && cp data/cv_data.json ui/cv_data.json
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./ui
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
